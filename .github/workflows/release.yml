name: Release (prod)

# Deliberately workflow_dispatch-only — this must NEVER run automatically on
# push/PR the way android.yml does, because it requires secrets
# (PROD_KEYSTORE_BASE64/PROD_KEYSTORE_PASSWORD/PROD_KEY_ALIAS/PROD_KEY_PASSWORD)
# that do not exist yet. Wire those up as GitHub Actions repo secrets before
# the first real run — see app/build.gradle.kts signingConfigs["prod"] for
# what each one is.
#
# Do not use this workflow until:
#   1. RISK_REGISTER.md R3 (legacy-data migration engine) is implemented
#      and tested — a release built before that ships an update that
#      silently deletes every existing user's bookmarks/settings.
#   2. You've confirmed which signing certificate this should use — see the
#      comment in build.gradle.kts signingConfigs["prod"]. A fresh keystore
#      here does NOT update-in-place over the legacy Capacitor release
#      unless that's the certificate the legacy release itself used.
on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download core databases from DB repo Release v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/databases
          gh release download v1 \
            --repo "infinitydattaashim1210958-coder/-------------vx-9f2k-static-cdn-01-d7b3e9f1-xqz7-prod-8f4a2c19d6rs--4j9w" \
            --pattern "core.db.gz" --pattern "ramayana_core.db.gz" \
            --clobber --dir app/src/main/assets/databases

      - name: Decompress database assets
        run: |
          cd app/src/main/assets/databases
          gunzip -k -f core.db.gz
          gunzip -k -f ramayana_core.db.gz
          rm -f core.db.gz ramayana_core.db.gz
          test -f core.db && test -f ramayana_core.db

      - name: Decode production keystore
        env:
          PROD_KEYSTORE_BASE64: ${{ secrets.PROD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${PROD_KEYSTORE_BASE64:-}" ]; then
            echo "::error::PROD_KEYSTORE_BASE64 secret is not set. See this workflow's header comment before running it." >&2
            exit 1
          fi
          echo "$PROD_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/prod-release.keystore"
          echo "PROD_KEYSTORE_PATH=${RUNNER_TEMP}/prod-release.keystore" >> "$GITHUB_ENV"

      - name: Assemble prod release APK
        env:
          PROD_KEYSTORE_PASSWORD: ${{ secrets.PROD_KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.PROD_KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.PROD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleProdRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: swadhyay-prod-release-apk
          path: app/build/outputs/apk/prod/release/*.apk
          retention-days: 14
