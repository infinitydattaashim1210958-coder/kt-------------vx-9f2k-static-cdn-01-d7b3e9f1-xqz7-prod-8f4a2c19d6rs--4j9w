name: Android Build + Database Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download and decompress database assets for CI tests
        run: |
         echo "=== Downloading DB assets from GitHub Release ==="
         mkdir -p app/src/main/assets/databases
         BASE_URL="https://github.com/infinitydattaashim1210958-coder/-------------vx-9f2k-static-cdn-01-d7b3e9f1-xqz7-prod-8f4a2c19d6rs--4j9w/releases/download/v1"
         curl -fsSL "$BASE_URL/core.db.gz"           | gunzip > app/src/main/assets/databases/core.db
         curl -fsSL "$BASE_URL/ramayana_core.db.gz"  | gunzip > app/src/main/assets/databases/ramayana_core.db
         ls -lh app/src/main/assets/databases/
         test -s app/src/main/assets/databases/core.db
         test -s app/src/main/assets/databases/ramayana_core.db
         echo "Download and decompression successful"
        
      - name: Database asset presence check
        run: |
          echo "=== Asset check ==="
          ls -lh app/src/main/assets/databases/
          test -f app/src/main/assets/databases/core.db
          test -f app/src/main/assets/databases/ramayana_core.db
          echo "Assets present"

      - name: Run unit tests (includes real DB count verification)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swadhyay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

      - name: Print verification summary
        if: success()
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "DATABASE VERIFICATION PASSED"
          echo "vedas=4"
          echo "mantras=20380"
          echo "kandas=6"
          echo "shlokas=17802"
          echo "APK BUILD PASSED"
          echo "========================================"
