# 01 — Update CI for `.db.gz` files

## Problem
GitHub Actions currently looks for:
- `core.db`
- `ramayana_core.db`

But the repository only has:
- `core.db.gz`
- `ramayana_core.db.gz`

## Fix
Replace the content of `.github/workflows/android.yml` with the version below.

---

### File: `.github/workflows/android.yml`

```yaml
name: Android Build + Database Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decompress database assets
        run: |
          echo "=== Decompressing .db.gz assets ==="
          cd app/src/main/assets/databases
          gunzip -k -f core.db.gz
          gunzip -k -f ramayana_core.db.gz
          ls -lh
          test -f core.db
          test -f ramayana_core.db
          echo "Decompression successful"

      - name: Database asset presence check
        run: |
          echo "=== Asset check ==="
          ls -lh app/src/main/assets/databases/
          test -f app/src/main/assets/databases/core.db
          test -f app/src/main/assets/databases/ramayana_core.db
          echo "Assets present"

      - name: Run unit tests (includes real DB count verification)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swadhyay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

      - name: Print verification summary
        if: success()
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "DATABASE VERIFICATION PASSED"
          echo "vedas=4"
          echo "mantras=20380"
          echo "kandas=6"
          echo "shlokas=17802"
          echo "APK BUILD PASSED"
          echo "========================================"
```

---

## How to apply on phone
1. Open the repository on GitHub.
2. Go to `.github/workflows/android.yml`
3. Tap the pencil (Edit) icon.
4. Delete everything and paste the content above.
5. Commit with message: `fix CI to decompress .db.gz assets`
