name: Android Build + Database Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Fetch bundled DBs from the DB repo Release (mirrors legacy
      # build.yml — this step was previously missing entirely, which made
      # the decompress step below fail on every run since the .gz files
      # were never present in source control).
      - name: Download core databases from DB repo Release v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/databases
          gh release download v1 \
            --repo "infinitydattaashim1210958-coder/-------------vx-9f2k-static-cdn-01-d7b3e9f1-xqz7-prod-8f4a2c19d6rs--4j9w" \
            --pattern "core.db.gz" --pattern "ramayana_core.db.gz" \
            --clobber --dir app/src/main/assets/databases
          ls -lh app/src/main/assets/databases/

      - name: Decompress database assets
        run: |
          echo "=== Decompressing .db.gz assets ==="
          cd app/src/main/assets/databases
          gunzip -k -f core.db.gz
          gunzip -k -f ramayana_core.db.gz
          # Remove the .gz files so only .db remains (avoids duplicate resource error)
          rm -f core.db.gz ramayana_core.db.gz
          ls -lh
          test -f core.db
          test -f ramayana_core.db
          echo "Decompression successful"

      - name: Database asset presence check
        run: |
          echo "=== Asset check ==="
          ls -lh app/src/main/assets/databases/
          test -f app/src/main/assets/databases/core.db
          test -f app/src/main/assets/databases/ramayana_core.db
          echo "Assets present"

      # ── Flavor-qualified task names: "dev" is the side-load flavor
      # (com.kyronix.swadhyaa.dev) actively used for testing against the
      # still-installed legacy app. CI builds/tests this flavor by default.
      # Swap to prodDebug/prodRelease explicitly when cutting a real release
      # candidate — never let assembleDebug (unqualified) run ambiguously
      # across both flavors in a release pipeline.
      - name: Run unit tests (includes real DB count verification)
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace

      - name: Assemble dev debug APK
        run: ./gradlew :app:assembleDevDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swadhyay-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 3

      - name: Print verification summary
        if: success()
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "DATABASE VERIFICATION PASSED"
          echo "vedas=4"
          echo "mantras=20380"
          echo "kandas=6"
          echo "shlokas=17802"
          echo "APK BUILD PASSED"
          echo "========================================"
