name: Android Build + Database Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Needed to create / overwrite the dev-latest GitHub Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Cache the debug keystore so every build is signed with the SAME key
      # (required for seamless in-app APK updates — without this each build
      # gets a fresh key and the installer forces an uninstall/reinstall).
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download core databases from DB repo Release v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/databases
          gh release download v1 \
            --repo "infinitydattaashim1210958-coder/-------------vx-9f2k-static-cdn-01-d7b3e9f1-xqz7-prod-8f4a2c19d6rs--4j9w" \
            --pattern "core.db.gz" --pattern "ramayana_core.db.gz" \
            --clobber --dir app/src/main/assets/databases
          ls -lh app/src/main/assets/databases/

      - name: Decompress database assets
        run: |
          echo "=== Decompressing .db.gz assets ==="
          cd app/src/main/assets/databases
          gunzip -k -f core.db.gz
          gunzip -k -f ramayana_core.db.gz
          rm -f core.db.gz ramayana_core.db.gz
          ls -lh
          test -f core.db
          test -f ramayana_core.db
          echo "Decompression successful"

      - name: Database asset presence check
        run: |
          echo "=== Asset check ==="
          ls -lh app/src/main/assets/databases/
          test -f app/src/main/assets/databases/core.db
          test -f app/src/main/assets/databases/ramayana_core.db
          echo "Assets present"

      - name: Write local.properties
        run: echo "gemini_api_key=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Run unit tests (includes real DB count verification)
        run: ./gradlew :app:testDevDebugUnitTest --stacktrace

      - name: Assemble dev debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:assembleDevDebug --stacktrace

      # Keep the artifact upload for manual downloads (3-day retention)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swadhyay-dev-debug-apk
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 3

      # Create a version.json the app reads to detect updates
      - name: Create version.json
        run: |
          echo '{
            "buildNumber": ${{ github.run_number }},
            "buildDate": "${{ github.event.head_commit.timestamp }}",
            "apkName": "app-dev-debug.apk"
          }' > version.json
          cat version.json

      # Publish / overwrite the dev-latest release so the app can always
      # find the latest APK at a fixed URL.  Pull requests are skipped
      # (they may not have write permission to the repo).
      - name: Publish dev-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the old dev-latest release + tag (ignore if absent)
          gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
          sleep 3
          gh release create dev-latest \
            --title "স্বাধ্যায় Dev #${{ github.run_number }}" \
            --notes "Auto-build on push. buildNumber: ${{ github.run_number }}" \
            --prerelease \
            "app/build/outputs/apk/dev/debug/app-dev-debug.apk#app-dev-debug.apk" \
            "version.json#version.json"
          echo "Release published: dev-latest  build=${{ github.run_number }}"

      - name: Print verification summary
        if: success()
        run: |
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "DATABASE VERIFICATION PASSED"
          echo "vedas=4"
          echo "mantras=20380"
          echo "kandas=6"
          echo "shlokas=17802"
          echo "APK BUILD PASSED"
          echo "RELEASE: dev-latest build=${{ github.run_number }}"
          echo "========================================"
